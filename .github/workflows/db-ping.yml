name: MongoDB keep-alive ping

# 정기 핑은 vercel.json의 Vercel Cron(하루 1번)이 담당하고,
# 이 워크플로는 Actions 탭에서 수동으로 핑을 확인할 때만 쓴다
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/cron/db-ping
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PING_URL: ${{ vars.DB_PING_URL || 'https://stay-mate-delta.vercel.app/api/cron/db-ping' }}
        run: |
          curl --fail-with-body -sS --max-time 60 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$PING_URL"
