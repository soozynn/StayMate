name: MongoDB keep-alive ping

on:
  schedule:
    # 10분마다 (GitHub 스케줄은 수 분 지연될 수 있음)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/cron/db-ping
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PING_URL: ${{ vars.DB_PING_URL || 'https://stay-mate-delta.vercel.app/api/cron/db-ping' }}
        run: |
          curl --fail-with-body -sS --max-time 60 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$PING_URL"
