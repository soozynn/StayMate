name: MongoDB keep-alive ping

on:
  schedule:
    # 약 10분마다. 정각·10분 단위는 GitHub 스케줄러가 몰려 실행이 누락되기 쉬워 분을 어긋나게 둠
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/cron/db-ping
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PING_URL: ${{ vars.DB_PING_URL || 'https://stay-mate-delta.vercel.app/api/cron/db-ping' }}
        run: |
          curl --fail-with-body -sS --max-time 60 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$PING_URL"
