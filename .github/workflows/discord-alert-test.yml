name: Discord alert test

# 배포된 사이트에서 Discord 에러 알림이 실제로 오는지 확인할 때
# Actions 탭에서 수동으로 실행한다 (테스트 메시지 1건 전송)
on:
  workflow_dispatch:

jobs:
  send-test-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: POST test error to /api/monitoring/client-error
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://stay-mate-delta.vercel.app' }}
        run: |
          NOW="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
          BODY=$(jq -n --arg now "$NOW" --arg url "$SITE_URL/alert-test" \
            '{name: "TestAlert", message: ("[테스트] Discord 알림 연결 확인 (" + $now + ") - 실제 에러가 아닙니다"), url: $url}')
          curl --fail-with-body -sS --max-time 30 -w 'HTTP %{http_code}\n' \
            -X POST -H "Content-Type: application/json" \
            -d "$BODY" \
            "$SITE_URL/api/monitoring/client-error"
